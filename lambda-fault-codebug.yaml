AWSTemplateFormatVersion: '2010-09-09'
Description: >
  FAULT VARIANT 3 — Recent code change (not infrastructure at all).
  A bug has been introduced in the handler: it now queries with the wrong
  key name ("id" instead of "Id", matching DynamoDB's case-sensitive key
  schema). IAM permissions and the table are correctly configured — the
  bug is purely in application code. Expected symptom: ValidationException
  from DynamoDB about the key schema not matching. This variant tests
  whether the agent correctly identifies "recent commit" as the cause
  rather than defaulting to an infrastructure explanation, since the
  error message itself is a DynamoDB error just like the other two faults.

Resources:
  PocTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: poc-devops-agent-table
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: Id
          AttributeType: S
      KeySchema:
        - AttributeName: Id
          KeyType: HASH

  PocFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: PocTableAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                Resource: !GetAtt PocTable.Arn

  PocFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: poc-devops-agent-fn
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt PocFunctionRole.Arn
      Timeout: 10
      Environment:
        Variables:
          TABLE_NAME: !Ref PocTable
      Code:
        ZipFile: |
          import boto3
          import os

          def handler(event, context):
              table_name = os.environ["TABLE_NAME"]
              ddb = boto3.resource("dynamodb")
              table = ddb.Table(table_name)
              # THE FAULT: key name is lowercase "id", but the table's
              # actual partition key is "Id" (case-sensitive). This is a
              # pure application-code bug, introduced as if by a recent
              # commit — infra/IAM are both correctly configured.
              response = table.get_item(Key={"id": "poc-item"})
              return {"status": "ok", "item_found": "Item" in response}

Outputs:
  FunctionName:
    Value: !Ref PocFunction
  TableName:
    Value: !Ref PocTable
