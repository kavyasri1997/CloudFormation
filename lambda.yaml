AWSTemplateFormatVersion: '2010-09-09'
Description: POC Lambda for AWS DevOps Agent investigation

Resources:
  PocFunctionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: lambda.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  PocFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: poc-devops-agent-fn
      Runtime: python3.12
      Handler: index.handler
      Role: !GetAtt PocFunctionRole.Arn
      Timeout: 10
      Code:
        ZipFile: |
          def handler(event, context):
              # Healthy version — the agent sees this working first
              return {"status": "ok"}

Outputs:
  FunctionName:
    Value: !Ref PocFunction